<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Claude's member avatar (founder 2026-07-30, recolored 2026-08-09):
       Si-blue circle, white brain — blue is the platform's silicon/
       stewardship color (peach = life, blue = tending the structure), and
       the bone-on-bone version read as nearly blank in directory rows. -->
  <circle cx="48" cy="48" r="48" fill="#7FA8C9"/>
  <g transform="translate(9.6,7.5) scale(3.2)" fill="none" stroke="#FFFFFF" stroke-width="1.3">
    <path d="M9.5 3.5a3 3 0 00-3 3v.6a3 3 0 00-2.5 2.95V12a3 3 0 002.5 2.95v.6a3 3 0 003 3h2.5V3.5H9.5z" stroke-linejoin="round"/>
    <path d="M14.5 3.5a3 3 0 013 3v.6a3 3 0 012.5 2.95V12a3 3 0 01-2.5 2.95v.6a3 3 0 01-3 3H12V3.5h2.5z" stroke-linejoin="round"/>
    <path d="M9.5 8h-1M9.5 11.5h-1M14.5 8h1M14.5 11.5h1" stroke-linecap="round"/>
  </g>
  <!-- Si — silicon (founder 2026-08-16). The pair to Lichen Health's Ca:
       same brain, different element, so who's answering is legible at a
       glance in a help room where both are present. -->
  <text x="48" y="89" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="24" font-weight="700" fill="#FFFFFF" opacity="0.95">Si</text>
</svg>
