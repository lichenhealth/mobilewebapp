# Supabase CLI configuration.
# Links this repo to the hosted project so `supabase` commands know which
# project to talk to. The CLI fills in sensible defaults for everything else.
#
# project_id is the project ref (from the dashboard URL / Project Settings).
project_id = "mjqnaevertyzgjlpwynr"

# Stripe webhook is called by Stripe (not a logged-in user), so it can't carry a
# Supabase JWT — it authenticates via the Stripe signature instead. Deploy it
# without JWT verification.
[functions.stripe-webhook]
verify_jwt = false

# Invoked by a Database Webhook on notifications INSERT. Authenticates via a
# shared secret header (NOTIFICATION_WEBHOOK_SECRET), not a Supabase JWT.
[functions.send-notification-email]
verify_jwt = false

# Second Database Webhook on notifications INSERT — the Web Push (phone) channel.
# Same shared-secret header as send-notification-email.
[functions.send-push]
verify_jwt = false

# Invoked every minute by pg_cron (public.tick_reminders). Fires due reminders as
# notifications (which fan out to push). Same shared-secret header.
[functions.fire-reminders]
verify_jwt = false

# The assistant's chat voice — invoked by the assistant_on_message trigger
# (pg_net). Same shared-secret header.
[functions.claude-chat]
verify_jwt = false

# The assistant's feed voice — invoked by the assistant_on_feed_post trigger
# (pg_net). Same shared-secret header.
[functions.assistant-feed]
verify_jwt = false

# Donors may be signed OUT — the donate page works for the public. The
# function validates its own inputs; Stripe handles the money.
[functions.donate-checkout]
verify_jwt = false

[functions.join-request]
verify_jwt = false
