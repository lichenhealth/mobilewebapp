# Supabase CLI configuration.
# Links this repo to the hosted project so `supabase` commands know which
# project to talk to. The CLI fills in sensible defaults for everything else.
#
# project_id is the project ref (from the dashboard URL / Project Settings).
project_id = "mjqnaevertyzgjlpwynr"

# Stripe webhook is called by Stripe (not a logged-in user), so it can't carry a
# Supabase JWT — it authenticates via the Stripe signature instead. Deploy it
# without JWT verification.
[functions.stripe-webhook]
verify_jwt = false

# Invoked by a Database Webhook on notifications INSERT. Authenticates via a
# shared secret header (NOTIFICATION_WEBHOOK_SECRET), not a Supabase JWT.
[functions.send-notification-email]
verify_jwt = false
