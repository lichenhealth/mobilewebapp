# KEEP THE IN-APP ASSISTANTS CURRENT, AUTOMATICALLY (founder 2026-11-08: "how
# can it see what you've done and know what's new, so i can keep building with
# you but not have to brief it when there are changes?").
#
# The assistants carry CLAUDE.md + the recent-ships list bundled at DEPLOY
# time (scripts/build-doctrine.mjs → _shared/doctrine.ts). Every push to main
# regenerates that and redeploys the four member-facing assistant functions, so
# nothing depends on a build session remembering to redeploy.
#
# Needs ONE repo secret: SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and
# variables → Actions). Without it the job says so and stops — it never fails
# the push.
name: Assistant doctrine
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Extra functions to deploy by name (space-separated)'
        required: false
        default: ''
concurrency: { group: assistant-doctrine, cancel-in-progress: true }
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 60 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Regenerate doctrine
        run: node scripts/build-doctrine.mjs
      - name: Redeploy assistant functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not set — skipping the assistant redeploy."
            exit 0
          fi
          for fn in assistant-feed claude-chat assistant-brief assistant-search; do
            npx -y supabase@latest functions deploy "$fn" --project-ref mjqnaevertyzgjlpwynr --yes
          done
      # SHIP WHAT CHANGED (founder 2026-11-15): any other edge function whose
      # folder changed in this push deploys too — but ONLY if it has its own
      # [functions.<name>] block in supabase/config.toml, so its verify_jwt
      # setting is written down. A function without one is skipped with a
      # notice, never deployed with a guessed setting.
      - name: Deploy changed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BEFORE: ${{ github.event.before }}
          EXTRA: ${{ github.event.inputs.deploy }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then BEFORE=HEAD~1; fi
          changed=$(git diff --name-only "$BEFORE" HEAD -- supabase/functions | awk -F/ 'NF>3 && $3!="_shared"{print $3}' | sort -u)
          for fn in $changed $EXTRA; do
            case " assistant-feed claude-chat assistant-brief assistant-search " in *" $fn "*) continue;; esac
            [ -d "supabase/functions/$fn" ] || continue
            if grep -q "^\[functions\.$fn\]" supabase/config.toml; then
              npx -y supabase@latest functions deploy "$fn" --project-ref mjqnaevertyzgjlpwynr --yes
            else
              echo "::notice::$fn changed but has no [functions.$fn] block in supabase/config.toml — not auto-deployed"
            fi
          done
