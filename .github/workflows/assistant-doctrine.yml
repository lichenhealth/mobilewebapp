# KEEP THE IN-APP ASSISTANTS CURRENT, AUTOMATICALLY (founder 2026-11-08: "how
# can it see what you've done and know what's new, so i can keep building with
# you but not have to brief it when there are changes?").
#
# The assistants carry CLAUDE.md + the recent-ships list bundled at DEPLOY
# time (scripts/build-doctrine.mjs → _shared/doctrine.ts). Every push to main
# regenerates that and redeploys the four member-facing assistant functions, so
# nothing depends on a build session remembering to redeploy.
#
# Needs ONE repo secret: SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and
# variables → Actions). Without it the job says so and stops — it never fails
# the push.
name: Assistant doctrine
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: assistant-doctrine, cancel-in-progress: true }
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 60 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Regenerate doctrine
        run: node scripts/build-doctrine.mjs
      - name: Redeploy assistant functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not set — skipping the assistant redeploy."
            exit 0
          fi
          for fn in assistant-feed claude-chat assistant-brief assistant-search; do
            npx -y supabase@latest functions deploy "$fn" --project-ref mjqnaevertyzgjlpwynr --yes
          done
